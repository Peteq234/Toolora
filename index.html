<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060709" />
    <meta name="color-scheme" content="dark" />
    <title>Toolora — 88 Free Online Tools, No Sign-Up Required</title>
    <meta
      name="description"
      content="Toolora is a free online toolkit with 88 genuinely useful tools — JSON formatter, Base64, image and PDF tools, height and BMI calculators, JSON and markup formatters, password generator, QR codes and more. No sign-up, nothing uploaded."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="canonical" href="https://toolora.com/" />

    <meta property="og:site_name" content="Toolora" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Toolora — 88 Free Online Tools, No Sign-Up Required" />
    <meta
      property="og:description"
      content="A calm, fast toolkit for everyday tasks and development. Format JSON, compress images, generate passwords, convert, compare and clean up — all in your browser."
    />
    <meta property="og:url" content="https://toolora.com/" />
    <meta property="og:image" content="https://toolora.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Toolora — free online tools, no account required" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toolora — 88 Free Online Tools" />
    <meta
      name="twitter:description"
      content="88 useful tools that run privately in your browser. Free, no account required."
    />
    <meta name="twitter:image" content="https://toolora.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://toolora.com/#organization",
            "name": "Toolora",
            "url": "https://toolora.com/",
            "description": "A free online tools platform with browser-based utilities for everyday tasks and development work.",
            "email": "hello@toolora.com",
            "logo": "https://toolora.com/favicon.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://toolora.com/#website",
            "url": "https://toolora.com/",
            "name": "Toolora",
            "publisher": { "@id": "https://toolora.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://toolora.com/tools?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #f4f5f0; background: #060709; font-family: sans-serif">
        Toolora's tools run in your browser and need JavaScript enabled. Please enable JavaScript
        to use the toolkit.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
